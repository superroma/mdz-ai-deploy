# The shared `repo` volume must be populated with the content repo's working
# tree (a `pages/` dir + `.git/`) BEFORE `up`. In production the control-plane
# spawn-site skill (Phase 3) clones it; for local testing see docs/smoke-test.md.
# An empty volume will error-loop mdz and the sidecar.
services:
  mdz:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mdz
      args:
        MDZ_REF: ${MDZ_REF}
    restart: unless-stopped
    environment:
      PAGES_ROOT: /data/repo/${PAGES_SUBDIR}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3001"
      HOST: 0.0.0.0
    volumes:
      - repo:/data/repo
    depends_on:
      sidecar:
        condition: service_started
    expose:
      - "3001"

  sidecar:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sidecar
    restart: unless-stopped
    environment:
      SYNC_REPO_DIR: /data/repo
      SYNC_BRANCH: ${SYNC_BRANCH}
      SYNC_BOT_NAME: ${SYNC_BOT_NAME}
      SYNC_BOT_EMAIL: ${SYNC_BOT_EMAIL}
      SYNC_DEBOUNCE_MS: ${SYNC_DEBOUNCE_MS}
      SYNC_POLL_MS: ${SYNC_POLL_MS}
      SYNC_EXCLUDE: ${SYNC_EXCLUDE}
      GIT_SSH_COMMAND: "ssh -i /keys/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
    volumes:
      - repo:/data/repo
      - ${DEPLOY_KEY}:/keys/deploy_key:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mdz

volumes:
  repo:
  caddy_data:
  caddy_config:
