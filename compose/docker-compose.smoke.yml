# Local smoke override (NOT for production).
#
# It makes the data plane testable without GitHub or SSH: the sidecar reaches a
# throwaway bare repo on the host via a bind mount at /origin, so the working
# tree's "origin" remote (file:///origin/origin.git) resolves inside the
# container. Production uses a real git@github.com remote + deploy key and does
# NOT use this file.
#
# See docs/smoke-test.md for the full procedure.
services:
  sidecar:
    volumes:
      - ${SMOKE_ORIGIN_DIR}:/origin
